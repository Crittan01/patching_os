---
- name: Generacion de Informe consolidado en un CSV
  hosts: "{{ lote | default([]) }}"
  gather_facts: false
  serial: 1
  vars_files:
    - vars/global.yml

  vars:
    log_dir: "/var/log/ansible_patches"
    out_csv_name: consolidado

  pre_tasks:
    - name: Leer resultados consolidades JSON
      when:
        - ambiente | lower == ambiente_target | lower
        - crq | lower == crq_input | lower
      ansible.builtin.slurp:
        src: "{{ log_dir }}/{{ crq_input | upper }}/{{ inventory_hostname }}/final_results_{{ inventory_hostname }}.json"
      register: final_results_file
      delegate_to: ansibleawx
      vars:
        ansible_connection: ssh
        ansible_user: "{{ informe_user }}"
        ansible_password: "{{ informe_password }}"
    #        ansible_ssh_private_key_file: ~/.ssh/id_rsa

    - name: Decodificar JSON final
      when:
        - ambiente | lower == ambiente_target | lower
        - crq | lower == crq_input | lower
      ansible.builtin.set_fact:
        results: "{{ final_results_file['content'] | b64decode | from_json }}"

    - name: Recolectar FACTS
      ansible.builtin.setup:
      ignore_unreachable: true
      register: fact_result
      retries: 5
      delay: 10
      until: not fact_result.unreachable | default(false)

    # Verificar si los facts se recopilaron correctamente
    - name: Establecer el estado de facts
      ansible.builtin.set_fact:
        facts_gathered: true
      when: ansible_os_family is defined

    - name: Manejar caso de facts fallidos
      when: facts_gathered is not defined
      block:
        - name: Creacion del archivo CSV y Encabezado
          ansible.builtin.lineinfile:
            path: "{{ log_dir }}/{{ crq_input | upper }}/{{ out_csv_name }}-{{ crq_input | upper }}.csv"
            line: "CRQ,Lote,Hostname,IP,Distribucion,Fecha,Repo_Fuente,Cantidad_Paquetes,Paquetes_Eliminados,Paquetes_Instalados,Punto_Fallo,Estado_Final"
            create: true
            state: present
            mode: "0755"
          run_once: true
          delegate_to: ansibleawx
          vars:
            ansible_connection: ssh
            ansible_user: "{{ informe_user }}"
            ansible_password: "{{ informe_password }}"

        - name: Escribir Columnas del CSV
          ansible.builtin.lineinfile:
            insertafter: EOF
            dest: "{{ log_dir }}/{{ crq_input | upper }}/{{ out_csv_name }}-{{ crq_input | upper }}.csv"
            line: >-
              {{ crq_input | upper }},
              {{- lote | default('N/A') }},
              {{- inventory_hostname }},
              {{- ip | default(ansible_host) }},
              {{- 'N/A' }},
              {{- 'N/A' }},
              {{- 'N/A' }},
              {{- 'N/A' }},
              {{- 'N/A' }},
              {{- 'N/A' }},
              {{- 'Validacion Previa' if not results.pre_validation.can_continue else
                  'Proceso Snapshot' if not results.snapshot.can_continue else
                  'Configuracion de Repositorio' if not results.repo_config.can_continue else
                  'Proceso de Parchado' if not results.patching.can_continue else
                  'Validacion Post-Parchado' if not results.post_validation.can_continue else
                  'Ninguno' }},
              {{- results.final_results.error.error | default('No status') }}
          delegate_to: ansibleawx
          vars:
            ansible_connection: ssh
            ansible_user: "{{ informe_user }}"
            ansible_password: "{{ informe_password }}"

  tasks:
    - name: Generacion de CSV para 'SLES'
      when:
        - facts_gathered is defined
        - ansible_os_family == 'Suse'
        - ansible_architecture == 'x86_64'
        - ambiente | lower == ambiente_target | lower
        - crq | lower == crq_input | lower
      block:
        - name: Generacion de CSV de Maquinas Familia 'Suse'
          ansible.builtin.include_role:
            name: out_csv
            tasks_from: family_suse.yml

    - name: Generacion de CSV para 'RHEL'
      when:
        - facts_gathered is defined
        - ansible_os_family == 'RedHat'
        - ansible_architecture == 'x86_64'
        - ambiente | lower == ambiente_target | lower
        - crq | lower == crq_input | lower
      block:
        - name: Generacion de CSV de Maquinas Familia 'RedHat'
          ansible.builtin.include_role:
            name: out_csv
            tasks_from: family_rhel.yml

    - name: Generacion de CSV para 'Windows'
      when:
        - facts_gathered is defined
        - ansible_os_family == 'Windows'
        - ambiente | lower == ambiente_target | lower
        - crq | lower == crq_input | lower
      block:
        - name: Generacion de CSV de Maquinas Familia 'Windows'
          ansible.builtin.include_role:
            name: out_csv
            tasks_from: family_windows.yml
