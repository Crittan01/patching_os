---
# tasks file for roles/validacion_post
- name: Validar estado previo y ejecutar validacion post
  block:
    - name: Inicializar variables por defecto
      ansible.builtin.set_fact:
        active_services_final: []
        service_changes: []
        service_recovery: { "results": [] }
        validation_error: {}
        services_info:
          {
            "total_antes": "{{ previous_results.pre_validation.services_initial.active_list | length }}",
            "total_despues": 0,
            "servicios_detenidos": [],
            "servicios_nuevos": [],
            "estado_servicios": "SKIPPED",
          }

    - name: BLOQUE validacion post
      when:
        - previous_results.pre_validation.can_continue
        - previous_results.snapshot.can_continue
        - previous_results.repo_config.can_continue
        - previous_results.patching.can_continue
      block:
        # Validación de servicios
        - name: Validar servicios
          block:
            - name: Validar servicios críticos
              ansible.builtin.service_facts:

            - name: Crear lista de servicios activos y en ejecución final
              ansible.builtin.set_fact:
                active_services_final: "{{ ansible_facts.services |
                  dict2items |
                  selectattr('value.state', 'equalto', 'running') |
                  map(attribute='key') |
                  list }}"

            - name: Analizar Cambios en Servicios
              ansible.builtin.set_fact:
                services_info:
                  total_antes: "{{ previous_results.pre_validation.services_initial.active_list | length }}"
                  total_despues: "{{ active_services_final | length }}"
                  servicios_detenidos: "{{ previous_results.pre_validation.services_initial.active_list | difference(active_services_final) }}"
                  servicios_nuevos: "{{ active_services_final | difference(previous_results.pre_validation.services_initial.active_list) }}"
                  estado_servicios:
                    "{{ 'NO_CHANGES' if (previous_results.pre_validation.services_initial.active_list | length == active_services_final | length
                    and (previous_results.pre_validation.services_initial.active_list | difference(active_services_final)) | length == 0)
                    else 'SERVICES_CHANGED' }}"

            - name: Intentar reiniciar servicios detenidos
              ansible.builtin.service:
                name: "{{ item }}"
                state: started
              register: service_recovery
              loop: "{{ services_info.servicios_detenidos }}"
              when: services_info.servicios_detenidos | length > 0
          rescue:
            - name: Registrar error de validación de servicios
              ansible.builtin.set_fact:
                validation_error:
                  "{{ validation_error | combine({'service_validation':
                  {'error': ansible_failed_result.msg | default('Error en validacion de Servicios') | regex_replace('\n', ' '),
                  'type': 'SERVICE_VALIDATION_ERROR',
                  'task': ansible_failed_task.name | default('unknown') if ansible_failed_task is defined else 'unknown'}}) }}"
      rescue:
        - name: Registrar error de validación post
          ansible.builtin.set_fact:
            validation_error:
              "{{ validation_error | combine({'post_validation':
              {'error': ansible_failed_result.msg | default('Error en validación de servicios'),
              'type': 'POST_VALIDATION_ERROR'}}) }}"

    - name: Crear JSON de resultados
      ansible.builtin.template:
        src: report_family_suse.j2
        dest: "{{ log_dir }}/{{ crq_input | upper }}/{{ inventory_hostname }}/final_results_{{ inventory_hostname }}.json"
        owner: "{{ owner }}"
        group: "{{ group }}"
        mode: "0755"
      delegate_to: "{{ server_informes }}"
      vars:
        ansible_connection: ssh
#        ansible_user: "{{ owner }}"
#        ansible_password: "{{ ansible_pwd }}"
      #        ansible_ssh_private_key_file: ~/.ssh/id_rsa
  rescue:
    - name: Registrar error general del proceso de parchado
      ansible.builtin.set_fact:
        validation_error: "{{ validation_error | default({}) | combine({
          'general_error': {
          'error': ansible_failed_result.module_stderr | default(ansible_failed_result.msg)
          | default('Error General en el Proceso de Parchado') | regex_replace('\n', ' '),
          'type': 'GENERAL_ERROR',
          'module': ansible_failed_result.module_name | default('unknown'),
          'host': inventory_hostname,
          'task_args': ansible_failed_result.module_args | default({}) | to_json
          }}) }}"

    - name: Crear JSON de resultados - error general del proceso de parchado
      ansible.builtin.template:
        src: report_family_rhel.j2
        dest: "{{ parchado_log_dir }}/{{ crq_input | upper }}/{{ inventory_hostname }}/final_results_{{ inventory_hostname }}.json"
        owner: "{{ owner }}"
        group: "{{ group }}"
        mode: "0755"
      delegate_to: "{{ server_informes }}"
      vars:
        ansible_connection: ssh
#        ansible_user: "{{ owner }}"
#        ansible_password: "{{ ansible_pwd }}"
      #        ansible_ssh_private_key_file: ~/.ssh/id_rsa
