---
- name: Configuracion de Repositorios
  hosts: "{{ lote | default([]) }}"
  gather_facts: false
  serial: "{{ serial | default(1) }}"
  vars_files:
    - vars/global.yml

  vars:
    log_dir: "/var/log/ansible_patches"

  pre_tasks:
    - name: Leer resultado de pre-validación
      when:
        - ambiente | lower == ambiente_target | lower
        - crq | lower == crq_input | lower
      ansible.builtin.slurp:
        src: "{{ log_dir }}/{{ crq_input | upper }}/{{ inventory_hostname }}/pre_validation_{{ inventory_hostname }}.json"
      register: pre_validation_file
      delegate_to: "{{ server_informes }}"
      vars:
        ansible_connection: ssh
        #        ansible_user: "{{ owner }}"
        #        ansible_password: "{{ ansible_pwd }}"
        ansible_python_interpreter: /usr/bin/python3
    #        ansible_ssh_private_key_file: ~/.ssh/id_rsa

    - name: Decodificar JSON de pre-validación
      when:
        - ambiente | lower == ambiente_target | lower
        - crq | lower == crq_input | lower
      ansible.builtin.set_fact:
        previous_results: "{{ pre_validation_file['content'] | b64decode | from_json }}"

    - name: Recolectar FACTS
      ansible.builtin.setup:
      ignore_unreachable: true
      register: fact_result
      retries: 5
      delay: 10
      until: not fact_result.unreachable | default(false)

    # Verificar si los facts se recopilaron correctamente
    - name: Establecer el estado de facts
      ansible.builtin.set_fact:
        facts_gathered: true
      when: ansible_os_family is defined

    - name: Manejar caso de facts fallidos
      when: facts_gathered is not defined
      block:
        - name: Registrar error de recolección de facts
          ansible.builtin.set_fact:
            fact_error:
              {
                "error": "No se pudo establecer conexion con el servidor",
                "type": "CONNECT_FAILED",
              }

        - name: Crear JSON para host con facts fallidos
          ansible.builtin.copy:
            content: |
              {
                "pre_validation": {{ previous_results.pre_validation | to_json }},
                "snapshot": {{ previous_results.pre_validation | to_json }},
                "repo_config": {
                  "status": "FAILED",
                  "can_continue": false,
                  "error": {{ fact_error | to_json }}
                }
              }
            dest: "{{ log_dir }}/{{ crq_input | upper }}/{{ inventory_hostname }}/repo_config_{{ inventory_hostname }}.json"
            owner: "{{ owner }}"
            group: "{{ group }}"
            mode: "0755"
          delegate_to: "{{ server_informes }}"
          vars:
            ansible_connection: ssh
  #            ansible_user: "{{ owner }}"
  #            ansible_password: "{{ ansible_pwd }}"
  tasks:
    - name: Configuracion Repositorios para Familia SLES
      when:
        - facts_gathered is defined
        - ansible_os_family == 'Suse'
        - ansible_architecture == 'x86_64'
        - ambiente | lower == ambiente_target | lower
        - crq | lower == crq_input | lower
      become: true
      block:
        - name: Configuracion Repositorios de Maquinas Familia 'Suse'
          ansible.builtin.include_role:
            name: config_repo
            tasks_from: family_suse.yml

    - name: Configuracion Repositorios para Familia RHEL
      when:
        - facts_gathered is defined
        - ansible_os_family == 'RedHat'
        - ansible_architecture == 'x86_64'
        - ambiente | lower == ambiente_target | lower
        - crq | lower == crq_input | lower
      become: true
      block:
        - name: Configuracion Repositorios de Maquinas Familia 'RedHat'
          ansible.builtin.include_role:
            name: config_repo
            tasks_from: family_rhel.yml

    - name: Validacion de Repositorios para Familia Windows
      when:
        - facts_gathered is defined
        - ansible_os_family == 'Windows'
        - ambiente | lower == ambiente_target | lower
        - crq | lower == crq_input | lower
      block:
        - name: Validacion Repositorios de Maquinas Familia 'Windows'
          ansible.builtin.include_role:
            name: config_repo
            tasks_from: family_windows.yml
