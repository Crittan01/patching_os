---
- name: Eliminar Snapshots especificos por CRQ
  hosts: localhost
  gather_facts: true
  serial: 1
  vars_files:
    - vars/global.yml

  vars:
    log_dir: "/var/log/ansible_patches"
    crq_dir: "{{ log_dir }}/{{ crq_input | upper }}"
    out_csv_name: "eliminacion_snap"
    deletion_results: []
    sharepoint_url: "https://colcomerciocom.sharepoint.com/sites/AreaInfraestructura"
    sharepoint_base_path: "/sites/AreaInfraestructura/Documentos%20compartidos"
    sharepoint_folder: "/General/Inventario%20Infraestructura/2024/Sincronizacion_Parcheado_SO/Archivos_Generados/Log_Eliminacion_SnapShot"

  tasks:
    - name: Creacion del archivo CSV y Encabezado de Eliminacion Snapshot
      ansible.builtin.lineinfile:
        path: "{{ crq_dir }}/{{ out_csv_name }}-{{ crq_input | upper }}.csv"
        line: "CRQ,Fecha,vCenter/ESXi,User,Datacenter,VM_Name,Snap_Name,VM_ID,Snap_ID"
        create: true
        state: present
        owner: "{{ owner }}"
        group: "{{ group }}"
        mode: "0755"
      delegate_to: 10.181.5.247
      run_once: true
      vars:
        ansible_connection: ssh
        ansible_user: "{{ owner }}"
        ansible_password: "{{ ansible_pwd }}"

    - name: Buscar archivos JSON de snapshots del CRQ
      ansible.builtin.find:
        paths: "{{ crq_dir }}"
        patterns: "snapshot_*.json"
        recurse: true
      register: snapshot_files
      delegate_to: 10.181.5.247
      vars:
        ansible_connection: ssh
        ansible_user: "{{ owner }}"
        ansible_password: "{{ ansible_pwd }}"

    - name: Debug - Buscar JSON de snapshot
      ansible.builtin.debug:
        var: snapshot_files

    - name: Leer y procesar JSONs de snapshots
      block:
        - name: Leer contenido de cada JSON
          ansible.builtin.slurp:
            src: "{{ item.path }}"
          register: json_contents
          loop: "{{ snapshot_files.files }}"
          delegate_to: 10.181.5.247
          vars:
            ansible_connection: ssh
            ansible_user: "{{ owner }}"
            ansible_password: "{{ ansible_pwd }}"

        - name: Crear lista de snapshots a eliminar
          ansible.builtin.set_fact:
            snapshots_to_delete: "{{ json_contents.results | map(attribute='content') |
                                   map('b64decode') | map('from_json') |
                                   selectattr('snapshot.status', 'equalto', 'OK') |
                                   list }}"

        - name: Debug - Crear lista de snapshots a eliminar
          ansible.builtin.debug:
            var: snapshots_to_delete

    - name: Eliminar snapshot Standalone
      ansible.builtin.include_role:
        name: snapshot
        tasks_from: delete_snap_standalone.yml
      loop: "{{ snapshots_to_delete }}"
      when: item.snapshot.virtualization_details.tipo_vmware == 'standalone'

    - name: Eliminar snapshot VCenter
      ansible.builtin.include_role:
        name: snapshot
        tasks_from: delete_snap_vcenter.yml
      loop: "{{ snapshots_to_delete }}"
      when: item.snapshot.virtualization_details.tipo_vmware == 'vcenter'

  post_tasks:
    - name: Leer contenido de archivo CSV
      ansible.builtin.command:
        cmd: cat "{{ crq_dir }}/{{ out_csv_name }}-{{ crq_input | upper }}.csv"
      register: csv_content
      changed_when: false
      delegate_to: 10.181.5.247
      vars:
        ansible_connection: ssh
        ansible_user: "{{ owner }}"
        ansible_password: "{{ ansible_pwd }}"

    - name: Imprimir contenido del CSV
      ansible.builtin.debug:
        var: csv_content.stdout_lines

    - name: Capturar Fecha del ZIP
      ansible.builtin.set_fact:
        fecha_crq: "{{ ansible_date_time.date }}_{{ ansible_date_time.hour }}-{{ ansible_date_time.minute }}-{{ ansible_date_time.second }}"

    - name: Comprimir carpeta CRQ
      community.general.archive:
        path: "{{ crq_dir }}"
        dest: "{{ crq_dir }}_{{ fecha_crq }}.zip"
        format: zip
        mode: "0755"
      delegate_to: 10.181.5.247
      vars:
        ansible_connection: ssh
        ansible_user: "{{ owner }}"
        ansible_password: "{{ ansible_pwd }}"

    - name: Imprimir contenido del CSV
      ansible.builtin.debug:
        var: csv_content.stdout_lines

    - name: Subir ZIP a SharePoint
      ansible.builtin.script:
        cmd: roles/out_csv/files/upload_sharepoint.py
          --file-path "{{ crq_dir }}_{{ fecha_crq }}.zip"
          --tenant-id "{{ tenant_id }}"
          --client-id "{{ client_id }}"
          --client-secret "{{ client_secret }}"
          --sharepoint-url "{{ sharepoint_url }}"
          --sharepoint-folder "{{ sharepoint_base_path }}{{ sharepoint_folder }}"
      register: upload_result
      delegate_to: 10.181.5.247
      changed_when: "upload_result.stdout is search('\"success\": true')"
      vars:
        ansible_connection: ssh
        ansible_user: "{{ owner }}"
        ansible_password: "{{ ansible_pwd }}"

    - name: Mostrar resultado de subida
      ansible.builtin.debug:
        msg: "{{ upload_result.stdout | from_json }}"
